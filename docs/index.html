<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#173f31">
<link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/img/icon-180.png">
<title>INDIA | Clínica de Valor</title>
<meta http-equiv="refresh" content="0; url=inicio/index.html">
<script>
// A raiz do site abre sempre a página inicial (/inicio/). O login fica em
// /login/. Links antigos que chegam na raiz com ?redirect= (vindos de páginas
// protegidas) continuam indo para o login; ?… e #… são mantidos (ex.: tokens
// de confirmação do Supabase no #).
(function () {
  var destino = /[?&]redirect=/.test(location.search) ? 'login/index.html' : 'inicio/index.html';
  location.replace(destino + location.search + location.hash);
})();
</script>
</head>
<body>
<p style="font-family:Arial,sans-serif;padding:24px">Abrindo a <a href="inicio/index.html">página inicial</a>…</p>
</body>
</html>
