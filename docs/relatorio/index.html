<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Meu Relatório | Clínica de Valor</title>
<link rel="stylesheet" href="../style.css">
<style>
.rel-section{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px;margin-top:18px}
.rel-section h2{color:var(--green);font-size:24px;margin:0 0 10px}
.rel-section h3{color:var(--green2);font-size:15px;text-transform:uppercase;letter-spacing:.04em;margin:20px 0 8px}
.evid-list{margin:8px 0 0;padding-left:20px}
.evid-list li{margin-bottom:4px;font-size:14px}
.momento-card{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:10px}
.momento-card b{font-family:Georgia,serif;font-size:22px;color:var(--green)}
.mfc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:10px}
.mfc-col{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.mfc-col h4{margin:0 0 10px;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.mfc-col.manter h4{color:#3f7a55}
.mfc-col.fortalecer h4{color:#b67a22}
.mfc-col.criar h4{color:#9a5057}
.mfc-col ul{margin:0;padding-left:18px}
.mfc-col li{margin-bottom:7px;font-size:13.5px;line-height:1.4}
.mfc-col .empty{color:var(--muted);font-size:13px}
.prioridade-card{background:var(--sidebar-active-bg,#f1e2cd);border-radius:14px;padding:18px;margin-top:10px}
.prioridade-card b{display:block;font-family:Georgia,serif;font-size:20px;color:var(--green)}
.rel-header-actions{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px}
.lista-relatorios{display:grid;gap:12px;margin-top:16px}
.lista-relatorios .item{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.lista-relatorios .item .txt b{display:block;color:var(--green);font-size:15px}
.lista-relatorios .item .txt span{font-size:13px;color:var(--muted)}
@media(max-width:720px){.mfc-grid{grid-template-columns:1fr}}
@media print{
  .app-sidebar,.app-topbar,.no-print{display:none !important}
  .app-content{padding:0 !important}
  .app-main{display:block !important}
  body{background:#fff !important}
}
</style>
<link rel="stylesheet" href="../assets/css/shell.css">
</head>
<body>
<main class="wrap" style="max-width:880px">
  <section class="section">
    <div class="eyebrow">Meu Relatório</div>
    <h1 class="serif" style="font-size:40px;color:var(--green);margin:8px 0">Meu Mapa da Clínica</h1>
    <div id="conteudo"><p class="lead">Carregando seu relatório…</p></div>
  </section>
</main>
<footer class="no-print">INDIA · CAFÉ, PESSOAS E NEGÓCIOS DE VALOR · Clínica de Valor</footer>

<script type="module">
import { supabase, avisarSupabaseNaoConfigurado } from '../assets/js/supabase-client.js';
import { requireAuth } from '../assets/js/auth.js';
import { mountAppShell } from '../assets/js/app-shell.js';
import { calcularScoresCompostos, classificarManterFortalecerCriar } from '../assets/js/diagnostico-engine.js';

avisarSupabaseNaoConfigurado();

const TITULOS_PONTO = {
  captar: 'Captar', precificar: 'Precificar', posicionar: 'Posicionar',
  produto_mix: 'Produto / Mix', esteira: 'Esteira', escalar: 'Escalar',
};
const MOMENTO_LABEL = { estruturacao: 'Estruturação', consolidacao: 'Consolidação', crescimento: 'Crescimento' };
const FERRAMENTA_NOME = { calculadora_sessao: 'Calculadora de Valor da Sessão', calculadora_grupo: 'Calculadora de Grupo' };
const FERRAMENTA_HREF = { calculadora_sessao: '../ferramentas/sessao.html', calculadora_grupo: '../ferramentas/grupo.html' };

const PONTO_AREA = {
  captar: ['captacao'], precificar: ['financas'], posicionar: ['posicionamento'],
  produto_mix: ['modelo'], esteira: ['modelo'], escalar: ['financas', 'captacao'],
};

const EVIDENCIAS_POR_PONTO = {
  captar: [
    ['acq_sabe_origem', 'Sabe de onde vieram os últimos 10 pacientes/contatos'],
    ['acq_dois_canais', 'Tem pelo menos 2 canais ativos de descoberta ou indicação'],
    ['acq_presenca_clara', 'Presença online permite entender rapidamente o que oferece'],
    ['acq_rotina_relacionamento', 'Tem rotina de relacionamento/parcerias, não só postagens pontuais'],
    ['acq_primeiro_contato_organizado', 'Primeiro contato é organizado e reduz dúvidas'],
    ['acq_nao_depende_uma_fonte', 'Entrada de pacientes não depende quase só de uma fonte'],
  ],
  precificar: [
    ['financas_contas_separadas', 'Contas pessoais e da clínica estão separadas'],
    ['financas_custo_conhecido', 'Sabe o custo mensal real da clínica'],
    ['financas_retirada_previsivel', 'Existe retirada/pró-labore minimamente previsível'],
    ['financas_reserva', 'Existe reserva financeira da clínica'],
    ['financas_acompanha_indicadores', 'Acompanha faturamento, ticket e ocupação mensalmente'],
    ['financas_ponto_equilibrio', 'Conhece o ponto de equilíbrio'],
  ],
  posicionar: [
    ['pos_publico_claro', 'Clareza de quem atende melhor e em quais contextos'],
    ['pos_diferenciais', 'Consegue nomear diferenciais além de formação/abordagem'],
    ['pos_presenca_coerente', 'Presença profissional comunica quem é e para quem trabalha'],
    ['pos_entendem_por_que_agora', 'Quem chega entende por que procurá-la agora'],
    ['pos_comunica_valor', 'Comunicação ajuda a perceber valor, não só preço'],
  ],
  produto_mix: [
    ['mod_servico_claro', 'Serviço principal está claro em formato, público e condições'],
    ['mod_novo_servico_resolve', 'Sabe qual problema de modelo um novo serviço resolveria'],
    ['mod_agenda_comporta', 'Agenda e energia atuais comportam expansão'],
  ],
  esteira: [],
  escalar: [],
};

function evidenciasDoPonto(ponto, respostas) {
  const campos = EVIDENCIAS_POR_PONTO[ponto] || [];
  const presentes = [];
  for (const [fieldId, label] of campos) {
    const v = respostas[fieldId];
    if (v === true) presentes.push(label);
    else if (typeof v === 'number' && v >= 3) presentes.push(`${label} (nota ${v}/4)`);
  }
  return presentes;
}

function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'html') e.innerHTML = v; else e.setAttribute(k, v);
  }
  for (const c of [].concat(children)) if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  return e;
}

function fmtMoeda(v) {
  if (v === null || v === undefined || v === '') return null;
  const n = Number(v);
  if (!Number.isFinite(n)) return null;
  return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
}

function fmtData(iso) {
  return new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
}

// 1. CENÁRIO ATUAL — síntese objetiva, montada só com o que a pessoa respondeu,
// sem inferir ou arredondar para melhor. Nunca inventa dado que falta.
function gerarCenarioAtual(respostas) {
  const partes = [];
  const receita = fmtMoeda(respostas.receita_atual);
  if (receita) partes.push(`fatura em média ${receita} por mês`);
  if (respostas.pacientes_atuais !== null && respostas.pacientes_atuais !== undefined) partes.push(`atende cerca de ${respostas.pacientes_atuais} pacientes por semana`);
  const sessao = fmtMoeda(respostas.valor_medio_sessao);
  if (sessao) partes.push(`cobra em média ${sessao} por sessão`);
  if (respostas.capacidade_agenda !== null && respostas.capacidade_agenda !== undefined) partes.push(`sua agenda comporta hoje ${respostas.capacidade_agenda} atendimentos por semana`);
  if (partes.length === 0) return 'Ainda não há dados suficientes nas suas respostas para compor um cenário atual.';
  return 'Hoje, você ' + partes.join(', ') + '.';
}

function renderMFC(container, mfc) {
  const sec = el('section', { class: 'rel-section' });
  sec.appendChild(el('h2', {}, '2-4. Manter, Fortalecer, Criar'));
  sec.appendChild(el('p', { class: 'small' }, 'Gerado a partir das suas respostas neste diagnóstico.'));
  const grid = el('div', { class: 'mfc-grid' });
  const colunas = [
    ['manter', 'Manter', mfc.manter || []],
    ['fortalecer', 'Fortalecer', mfc.fortalecer || []],
    ['criar', 'Criar', mfc.criar || []],
  ];
  for (const [cls, label, itens] of colunas) {
    const col = el('div', { class: `mfc-col ${cls}` });
    col.appendChild(el('h4', {}, label));
    if (itens.length > 0) col.appendChild(el('ul', {}, itens.map((i) => el('li', {}, i.label))));
    else col.appendChild(el('p', { class: 'empty' }, 'Nenhum item identificado ainda nesta coluna.'));
    grid.appendChild(col);
  }
  sec.appendChild(grid);
  container.appendChild(sec);
}

function renderBlocoPontoLatente(container, { texto, respostas, pontoLatente, principal, mfc, tituloSecao }) {
  const sec = el('section', { class: 'rel-section' });
  sec.appendChild(el('div', { class: 'eyebrow' }, tituloSecao));
  sec.appendChild(el('div', { class: 'badge badge-draft' }, principal ? 'Ponto Latente Principal' : 'Ponto Latente Complementar'));
  sec.appendChild(el('h2', {}, texto.titulo));
  sec.appendChild(el('p', {}, texto.sintese));

  if (principal) {
    sec.appendChild(el('h3', {}, 'O que pode estar por trás'));
    sec.appendChild(el('p', {}, texto.o_que_por_tras));
  }

  sec.appendChild(el('h3', {}, 'Como isso aparece na sua clínica'));
  const evid = evidenciasDoPonto(pontoLatente, respostas);
  if (evid.length > 0) sec.appendChild(el('ul', { class: 'evid-list' }, evid.map((t) => el('li', {}, t))));
  else sec.appendChild(el('p', { class: 'small' }, 'Ainda não há evidências suficientes nas suas respostas para personalizar esta seção.'));

  const areas = PONTO_AREA[pontoLatente] || [];
  const relacionados = [...(mfc.fortalecer || []), ...(mfc.criar || [])].filter((i) => areas.includes(i.area));
  if (relacionados.length > 0) {
    sec.appendChild(el('h3', {}, 'Por que merece atenção'));
    sec.appendChild(el('ul', { class: 'evid-list' }, relacionados.map((i) => el('li', {}, i.label))));
  }

  if (principal) {
    sec.appendChild(el('h3', {}, 'Por que olhar para isso agora'));
    sec.appendChild(el('p', {}, texto.por_que_agora));
    sec.appendChild(el('h3', {}, 'Caminho recomendado'));
    sec.appendChild(el('p', {}, texto.caminho_desenvolvimento));
    sec.appendChild(el('h3', {}, 'Para Refletir'));
    sec.appendChild(el('p', { html: `<em>${texto.para_refletir}</em>` }));
  }

  container.appendChild(sec);
  return sec;
}

// Lê a recomendação (capítulo/ferramenta) congelada no momento do diagnóstico.
// Fallback só para diagnósticos antigos, salvos antes dessa mudança existir.
async function resolverRecomendacao(resultado, chave, pontoLatente) {
  if (resultado[chave]) return resultado[chave];
  if (!pontoLatente) return null;
  const [{ data: capMap }, { data: ferrMap }] = await Promise.all([
    supabase.from('ponto_latente_capitulo_map').select('capitulo_numero, status, manual_capitulos(titulo)').eq('ponto_latente', pontoLatente).maybeSingle(),
    supabase.from('ponto_latente_ferramenta_map').select('ferramenta, status').eq('ponto_latente', pontoLatente).maybeSingle(),
  ]);
  return {
    capitulo_numero: (capMap?.capitulo_numero && capMap.status === 'validado') ? capMap.capitulo_numero : null,
    capitulo_titulo: (capMap?.capitulo_numero && capMap.status === 'validado') ? (capMap.manual_capitulos?.titulo || null) : null,
    ferramenta: (ferrMap?.ferramenta && ferrMap.status === 'validado') ? ferrMap.ferramenta : null,
  };
}

function renderListaRelatorios(conteudo, diagnosticos) {
  conteudo.innerHTML = '';
  const sec = el('section', { class: 'rel-section' });
  sec.appendChild(el('h2', {}, 'Meus Relatórios'));
  if (!diagnosticos || diagnosticos.length === 0) {
    sec.appendChild(el('p', { class: 'small' }, 'Você ainda não concluiu nenhum diagnóstico.'));
    sec.appendChild(el('a', { href: '../mapa/index.html', class: 'btn', style: 'margin-top:10px' }, 'Fazer meu diagnóstico →'));
  } else {
    const lista = el('div', { class: 'lista-relatorios' });
    diagnosticos.forEach((d, i) => {
      const ciclo = diagnosticos.length - i;
      const item = el('div', { class: 'item' });
      const txt = el('div', { class: 'txt' });
      txt.appendChild(el('b', {}, `Ciclo ${ciclo} — ${fmtData(d.criado_em)}`));
      const ponto = d.resultado_calculado?.ponto_latente_principal;
      txt.appendChild(el('span', {}, ponto ? `Prioridade: ${TITULOS_PONTO[ponto] || ponto}` : 'Sem ponto latente calculado'));
      item.appendChild(txt);
      item.appendChild(el('a', { href: `?id=${d.id}`, class: 'btn alt' }, 'Abrir →'));
      lista.appendChild(item);
    });
    sec.appendChild(lista);
  }
  conteudo.appendChild(sec);
}

async function renderRelatorioDetalhe(conteudo, diag) {
  const resultado = diag.resultado_calculado;
  if (!resultado || resultado.status === 'dados_insuficientes' || !resultado.ponto_latente_principal) {
    conteudo.innerHTML = `<div class="alert alert-info">Recebemos esse diagnóstico. Algumas respostas ainda são necessárias para calcular o Ponto Latente.</div>`;
    return;
  }

  conteudo.innerHTML = '';

  const header = el('div', { class: 'rel-header-actions no-print' });
  header.appendChild(el('a', { href: '../relatorio/index.html', class: 'small' }, '← Meus Relatórios'));
  const btnPdf = el('button', { class: 'btn alt', type: 'button' }, 'Baixar meu relatório em PDF');
  btnPdf.addEventListener('click', () => window.print());
  header.appendChild(btnPdf);
  conteudo.appendChild(header);

  if (diag.momento_clinica) {
    const momentoSec = el('section', { class: 'rel-section' });
    momentoSec.appendChild(el('div', { class: 'eyebrow' }, 'Seu Momento Atual'));
    const momentoCard = el('div', { class: 'momento-card' });
    momentoCard.appendChild(el('b', {}, MOMENTO_LABEL[diag.momento_clinica]));
    momentoSec.appendChild(momentoCard);
    conteudo.appendChild(momentoSec);
  }

  // 1. Cenário Atual
  const cenarioSec = el('section', { class: 'rel-section' });
  cenarioSec.appendChild(el('div', { class: 'eyebrow' }, '1. Cenário Atual'));
  cenarioSec.appendChild(el('p', {}, gerarCenarioAtual(diag.respostas)));
  conteudo.appendChild(cenarioSec);

  // 2-4. Manter / Fortalecer / Criar (do snapshot, com fallback pra diagnósticos antigos)
  let mfc = { manter: resultado.manter, fortalecer: resultado.fortalecer, criar: resultado.criar };
  if (!resultado.manter) {
    const { valores } = calcularScoresCompostos(diag.respostas);
    mfc = classificarManterFortalecerCriar(diag.respostas, valores);
  }
  renderMFC(conteudo, mfc);

  // 5. Ponto Latente Principal
  const { data: textoPrincipal } = await supabase.from('pontos_latentes_textos').select('*').eq('ponto_latente', resultado.ponto_latente_principal).single();
  const secPrincipal = renderBlocoPontoLatente(conteudo, { texto: textoPrincipal, respostas: diag.respostas, pontoLatente: resultado.ponto_latente_principal, principal: true, mfc, tituloSecao: '5. Ponto Latente Principal' });

  // 6. Ponto Latente Complementar
  if (resultado.ponto_latente_complementar) {
    const { data: textoComplementar } = await supabase.from('pontos_latentes_textos').select('*').eq('ponto_latente', resultado.ponto_latente_complementar).single();
    renderBlocoPontoLatente(conteudo, { texto: textoComplementar, respostas: diag.respostas, pontoLatente: resultado.ponto_latente_complementar, principal: false, mfc, tituloSecao: '6. Ponto Latente Complementar' });
  }

  // 7. Sua Prioridade Agora
  const prioSec = el('section', { class: 'rel-section' });
  prioSec.appendChild(el('div', { class: 'eyebrow' }, '7. Sua Prioridade Agora'));
  const prioCard = el('div', { class: 'prioridade-card' });
  prioCard.appendChild(el('b', {}, textoPrincipal?.titulo || TITULOS_PONTO[resultado.ponto_latente_principal]));
  prioCard.appendChild(el('span', {}, textoPrincipal?.sintese || ''));
  prioSec.appendChild(prioCard);
  conteudo.appendChild(prioSec);

  // 8-9. Para Compreender / Para Aplicar
  const recomendacao = await resolverRecomendacao(resultado, 'recomendacao_principal', resultado.ponto_latente_principal);
  const capAplicaSec = el('section', { class: 'rel-section' });
  if (recomendacao?.capitulo_numero) {
    capAplicaSec.appendChild(el('div', { class: 'eyebrow' }, '8. Para Compreender'));
    capAplicaSec.appendChild(el('a', { href: `../manual/index.html?cap=${recomendacao.capitulo_numero}`, class: 'btn alt' }, `Abrir capítulo — ${recomendacao.capitulo_titulo || ''}`));
  }
  if (recomendacao?.ferramenta) {
    capAplicaSec.appendChild(el('div', { class: 'eyebrow', style: 'margin-top:18px' }, '9. Para Aplicar'));
    capAplicaSec.appendChild(el('a', { href: FERRAMENTA_HREF[recomendacao.ferramenta], class: 'btn alt' }, `Abrir ${FERRAMENTA_NOME[recomendacao.ferramenta]}`));
  }
  if (capAplicaSec.children.length > 0) conteudo.appendChild(capAplicaSec);

  // 10. Próximo Passo
  const avancarSec = el('section', { class: 'rel-section no-print' });
  avancarSec.appendChild(el('div', { class: 'eyebrow' }, '10. Próximo Passo'));
  avancarSec.appendChild(el('p', {}, 'Transforme isso em ações concretas para os próximos 30 dias.'));
  avancarSec.appendChild(el('a', { href: '../plano/index.html', class: 'btn' }, 'Ir para Meu Plano de Ação →'));
  conteudo.appendChild(avancarSec);
}

(async () => {
  const session = await requireAuth('../login/index.html');
  if (!session) return;
  await mountAppShell('relatorio', session, '..');
  const conteudo = document.getElementById('conteudo');

  const params = new URLSearchParams(location.search);
  const diagId = params.get('id');

  if (diagId) {
    const { data: diag, error } = await supabase.from('diagnosticos').select('*').eq('id', diagId).maybeSingle();
    if (error) { conteudo.innerHTML = `<div class="alert alert-error">Erro ao carregar seu relatório: ${error.message}</div>`; return; }
    if (!diag) { conteudo.innerHTML = `<div class="alert alert-error">Relatório não encontrado.</div>`; return; }
    await renderRelatorioDetalhe(conteudo, diag);
    return;
  }

  const { data: diagnosticos, error } = await supabase.from('diagnosticos').select('id, criado_em, resultado_calculado').eq('user_id', session.user.id).order('criado_em', { ascending: false });
  if (error) { conteudo.innerHTML = `<div class="alert alert-error">Erro ao carregar seus relatórios: ${error.message}</div>`; return; }

  if (diagnosticos && diagnosticos.length === 1) {
    // só 1 ciclo: vai direto pro relatório, sem obrigar a passar pela lista.
    const { data: diag } = await supabase.from('diagnosticos').select('*').eq('id', diagnosticos[0].id).single();
    await renderRelatorioDetalhe(conteudo, diag);
    return;
  }

  renderListaRelatorios(conteudo, diagnosticos);
})();
</script>
</body>
</html>
