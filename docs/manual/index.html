<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manual | Clínica de Valor</title>
<link rel="stylesheet" href="../style.css">
<style>
.chapter{margin:18px 0}
.chapter h2{font-size:28px;color:var(--green)}
.chapter p{line-height:1.7}
.recomendado-card{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:16px 0}
.recomendado-card .txt b{display:block;color:var(--green);font-size:15px}
.recomendado-card .txt span{font-size:13px;color:var(--muted)}
</style>
<link rel="stylesheet" href="../assets/css/shell.css">
</head>
<body>
<main class="wrap">
  <section class="section">
    <div class="eyebrow">Manual da Clínica como Negócio na ACP</div>
    <h1 class="serif" style="font-size:46px;color:var(--green);margin:8px 0">Abra apenas o que seu caminho pede agora.</h1>
    <p class="lead" id="manualLead">Conteúdo protegido — disponível somente para quem já fez login.</p>
    <div id="recomendadoWrap"></div>
    <div style="margin:20px 0">
      <label for="chapterSelect" class="small">Ir para capítulo</label>
      <select id="chapterSelect" style="display:block;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:8px;background:white;max-width:520px;width:100%"></select>
    </div>
    <div id="conteudoManual"><p>Carregando…</p></div>
  </section>
</main>
<footer>INDIA · CAFÉ, PESSOAS E NEGÓCIOS DE VALOR · Clínica de Valor</footer>

<script type="module">
import { supabase, avisarSupabaseNaoConfigurado } from '../assets/js/supabase-client.js';
import { requireAuth } from '../assets/js/auth.js';
import { mountAppShell } from '../assets/js/app-shell.js';

avisarSupabaseNaoConfigurado();

const TITULOS_PONTO = { captar: 'Captar', precificar: 'Precificar', posicionar: 'Posicionar', produto_mix: 'Produto / Mix', esteira: 'Esteira', escalar: 'Escalar' };

(async () => {
  const session = await requireAuth('../login/index.html');
  if (!session) return;
  await mountAppShell('manual', session, '..');

  const { data: capitulos, error } = await supabase
    .from('manual_capitulos')
    .select('numero, titulo, conteudo_html, ordem')
    .order('ordem', { ascending: true });

  const conteudoEl = document.getElementById('conteudoManual');
  if (error) {
    conteudoEl.innerHTML = `<div class="alert alert-error">Não foi possível carregar o Manual: ${error.message}</div>`;
    return;
  }
  if (!capitulos || capitulos.length === 0) {
    conteudoEl.innerHTML = `<div class="alert alert-info">O Manual está sendo preparado e ficará disponível em breve.</div>`;
    return;
  }

  const params = new URLSearchParams(location.search);
  if (!params.get('cap')) {
    const { data: diag } = await supabase.from('diagnosticos').select('resultado_calculado').eq('user_id', session.user.id).maybeSingle();
    const pontoPrincipal = diag?.resultado_calculado?.ponto_latente_principal;
    if (pontoPrincipal) {
      const { data: capMap } = await supabase.from('ponto_latente_capitulo_map').select('capitulo_numero, status, manual_capitulos(titulo)').eq('ponto_latente', pontoPrincipal).maybeSingle();
      if (capMap?.capitulo_numero && capMap.status === 'validado') {
        document.getElementById('recomendadoWrap').innerHTML = `
          <div class="recomendado-card">
            <div class="txt"><b>Capítulo recomendado para você</b><span>Com base no seu diagnóstico (${TITULOS_PONTO[pontoPrincipal]}) — Capítulo ${capMap.capitulo_numero}, ${capMap.manual_capitulos?.titulo || ''}</span></div>
            <a class="btn alt" href="?cap=${capMap.capitulo_numero}">Abrir capítulo →</a>
          </div>`;
      }
    }
  }

  const select = document.getElementById('chapterSelect');
  for (const cap of capitulos) {
    const opt = document.createElement('option');
    opt.value = 'cap' + cap.numero;
    opt.textContent = `Capítulo ${cap.numero} — ${cap.titulo}`;
    select.appendChild(opt);
  }

  conteudoEl.innerHTML = '';
  for (const cap of capitulos) {
    const wrapper = document.createElement('section');
    wrapper.className = 'panel chapter';
    wrapper.id = 'cap' + cap.numero;
    wrapper.dataset.cap = String(cap.numero);
    wrapper.style.margin = '18px 0';
    wrapper.innerHTML = cap.conteudo_html;
    conteudoEl.appendChild(wrapper);
  }

  const capParam = params.get('cap');
  const alvo = capParam ? document.getElementById('cap' + capParam) : null;
  if (alvo) {
    select.value = 'cap' + capParam;
    alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  select.addEventListener('change', () => {
    const el = document.getElementById(select.value);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
})();
</script>
</body>
</html>
