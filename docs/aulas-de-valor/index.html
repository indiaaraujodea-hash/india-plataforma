<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Aulas de Valor | INDIA</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../assets/css/shell.css">
<style>
.av-card{background:#fff;border:1px solid var(--line-soft);border-radius:14px;padding:24px;margin-top:16px}
.av-card b{display:block;color:var(--ink-green);font-size:16px;margin-bottom:6px}
.av-card p{font-size:13.5px;color:#4b5148;margin:0}
.av-lista{display:grid;gap:20px;margin-top:16px}
.av-item{background:#fff;border:1px solid var(--line-soft);border-radius:14px;overflow:hidden}
.av-item video,.av-item iframe{display:block;width:100%;aspect-ratio:16/9;background:#000;border:0}
.av-item .info{padding:16px 20px}
.av-item .info b{display:block;color:var(--ink-green);font-size:15.5px;margin-bottom:4px}
.av-item .info p{font-size:13px;color:#4b5148;margin:0 0 8px}
.av-item .info a.link{font-size:12.5px;color:var(--terracota-dark,#9a5b34);font-weight:700;text-decoration:none}
.av-item .info a.link:hover{text-decoration:underline}
</style>
</head>
<body>

<div class="plan-header">
  <div class="eyebrow">Aulas de Valor</div>
  <h1>Aulas de Valor</h1>
  <p class="lead" style="color:var(--muted2)">Uma biblioteca crescente de aulas para fortalecer sua clínica — organizadas por tema, algumas liberadas por produto, outras liberadas especialmente para você.</p>
</div>

<div id="aviso"></div>

<div id="conteudoAulas" style="display:none">
  <div class="av-lista" id="listaAulas"></div>
</div>

<script type="module">
import { supabase, avisarSupabaseNaoConfigurado } from '../assets/js/supabase-client.js';
import { requireAuth } from '../assets/js/auth.js';
import { mountAppShell } from '../assets/js/app-shell.js';

avisarSupabaseNaoConfigurado();

// Vídeo local (mp4 hospedado no próprio site) toca embutido com <video>.
// Link do Google Drive vira um player embutido via iframe (/preview) — o
// link original continua disponível embaixo, para abrir direto no Drive.
function driveEmbedUrl(url) {
  const m = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
  return m ? `https://drive.google.com/file/d/${m[1]}/preview` : null;
}

function renderPlayer(a) {
  if (!a.video_url) return '';
  const embedDrive = driveEmbedUrl(a.video_url);
  if (embedDrive) return `<iframe src="${embedDrive}" allow="autoplay" allowfullscreen></iframe>`;
  return `<video controls playsinline preload="none" src="${a.video_url}"></video>`;
}

(async () => {
  const session = await requireAuth('../login/index.html');
  if (!session) return;
  await mountAppShell('aulas-de-valor', session, '..');

  const aviso = document.getElementById('aviso');
  const lista = document.getElementById('listaAulas');

  const { data: aulas, error } = await supabase.from('aulas_biblioteca').select('*').eq('ativo', true).order('ordem', { ascending: true });
  if (error) { aviso.innerHTML = `<div class="alert alert-error">Erro ao carregar as aulas: ${error.message}</div>`; return; }

  lista.innerHTML = (aulas && aulas.length)
    ? aulas.map((a) => `
        <div class="av-item">
          ${renderPlayer(a)}
          <div class="info">
            <b>${a.titulo}</b>
            ${a.descricao ? `<p>${a.descricao}</p>` : ''}
            ${a.video_url ? `<a class="link" href="${a.video_url}" target="_blank" rel="noopener">Abrir em outra aba ↗</a>` : ''}
          </div>
        </div>`).join('')
    : `<div class="av-card">
        <b>Ainda organizando este conteúdo</b>
        <p>As Aulas de Valor estão sendo preparadas. Assim que uma aula for liberada para você — seja porque faz parte de um produto que você tem, seja porque a India liberou especificamente para você — ela aparece aqui.</p>
      </div>`;

  document.getElementById('conteudoAulas').style.display = '';
})();
</script>
</body>
</html>
