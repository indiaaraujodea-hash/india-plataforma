<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Plano | Clínica de Valor</title><link rel="stylesheet" href="../style.css"></head><body><header class="top"><nav class="nav"><a class="brand" href="../index.html"><span class="mark">❧</span><b>INDIA</b></a><div class="navlinks"><a href="../index.html">Início</a><a href="../mapa/index.html">Meu Mapa</a><a href="../ferramentas/index.html">Ferramentas</a><a href="../manual/index.html">Manual</a><a href="../plano/index.html">Meu Plano</a></div></nav></header><main class="wrap"><section class="section"><div class="eyebrow">Meu Plano</div><h1 class="serif" style="font-size:46px;color:var(--green);margin:8px 0">Transforme o diagnóstico em execução.</h1><p class="lead">Registre um movimento principal, uma ação concreta e um prazo. Esta versão salva o plano neste navegador.</p><form id="p" class="panel" style="max-width:780px;margin-top:26px"><label>Meu movimento principal<input id="mov" required style="width:100%;padding:12px;margin:6px 0 16px;border:1px solid var(--line);border-radius:8px"></label><label>O que vou fazer primeiro<textarea id="acao" required rows="4" style="width:100%;padding:12px;margin:6px 0 16px;border:1px solid var(--line);border-radius:8px"></textarea></label><label>Prazo<input id="prazo" type="date" required style="width:100%;padding:12px;margin:6px 0 16px;border:1px solid var(--line);border-radius:8px"></label><label>Indicador de acompanhamento<input id="indic" style="width:100%;padding:12px;margin:6px 0 16px;border:1px solid var(--line);border-radius:8px" placeholder="Ex.: ticket médio, pacientes ativos, faturamento"></label><button class="btn" type="submit">Salvar meu plano</button><span id="status" class="small" style="margin-left:12px"></span></form></section></main><script>const f=document.getElementById('p');const ids=['mov','acao','prazo','indic'];try{const d=JSON.parse(localStorage.getItem('clinicaPlano')||'{}');ids.forEach(x=>document.getElementById(x).value=d[x]||'');const m=JSON.parse(localStorage.getItem('clinicaDiag')||'{}');if(!document.getElementById('mov').value&&m.primary)document.getElementById('mov').value=m.primary}catch(e){}f.addEventListener('submit',e=>{e.preventDefault();const d={};ids.forEach(x=>d[x]=document.getElementById(x).value);localStorage.setItem('clinicaPlano',JSON.stringify(d));document.getElementById('status').textContent='Plano salvo neste navegador.'})</script><footer>INDIA · CAFÉ, PESSOAS E NEGÓCIOS DE VALOR · Clínica de Valor</footer></body></html>
