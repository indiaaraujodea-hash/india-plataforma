<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Biblioteca de Aulas | Painel Administrativo</title>
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="../../assets/css/shell.css">
<style>
.au-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
.au-card.inativo{opacity:.55}
.au-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.au-topo h3{margin:0;color:var(--green);font-size:19px}
.au-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:4px}
.au-acoes{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.au-acoes button,.au-acoes a{font-size:12.5px;padding:7px 14px}
.form-aula{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}
.form-aula label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin:12px 0 4px}
.form-aula label:first-child{margin-top:0}
.form-aula input,.form-aula textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;font-size:14px}
.form-aula textarea{min-height:70px}
.form-acoes{display:flex;gap:10px;margin-top:16px}
</style>
</head>
<body>
<main class="wrap" style="max-width:900px">
  <section class="section">
    <div class="eyebrow">Painel Administrativo</div>
    <h1 class="serif" style="font-size:34px;color:var(--green);margin:8px 0">Biblioteca de Aulas</h1>
    <p style="margin:0 0 6px"><a href="../index.html" class="small">← Voltar para clientes</a></p>
    <p class="small" style="margin:0 0 16px">Conteúdo reutilizável entre mentoradas. A liberação de cada aula para uma mentorada específica acontece na ficha dela, aba Aulas.</p>
    <button type="button" class="btn" id="btnNovo" style="padding:10px 18px;font-size:14px">+ Nova aula</button>
    <div id="formNovo"></div>
    <div id="lista"><p>Carregando…</p></div>
  </section>
</main>
<footer>INDIA · CAFÉ, PESSOAS E NEGÓCIOS DE VALOR · Clínica de Valor</footer>

<script type="module">
import { supabase, avisarSupabaseNaoConfigurado } from '../../assets/js/supabase-client.js';
import { requireAdmin } from '../../assets/js/auth.js';
import { mountAppShell } from '../../assets/js/app-shell.js';

avisarSupabaseNaoConfigurado();

function formularioHtml(a) {
  return `
    <div class="form-aula">
      <h3 style="margin:0;color:var(--green)">${a && a.id ? 'Editar aula' : 'Nova aula'}</h3>
      <label>Título</label><input type="text" id="fTitulo" value="${a && a.titulo ? a.titulo.replace(/"/g, '&quot;') : ''}">
      <label>Descrição</label><textarea id="fDescricao">${a && a.descricao || ''}</textarea>
      <label>Link do vídeo (opcional)</label><input type="url" id="fVideo" value="${a && a.video_url || ''}" placeholder="https://...">
      <label>Arquivo — link do Drive/PDF (opcional)</label><input type="url" id="fArquivo" value="${a && a.arquivo_url || ''}" placeholder="https://...">
      <label>Ordem de exibição</label><input type="number" id="fOrdem" value="${a && a.ordem != null ? a.ordem : 0}">
      <div class="form-acoes">
        <button type="button" class="btn" id="btnSalvarAula" style="padding:10px 18px;font-size:14px">Salvar</button>
        <button type="button" class="btn alt" id="btnCancelarAula" style="padding:10px 18px;font-size:14px">Cancelar</button>
      </div>
      <p class="small" id="formMsg" style="margin-top:8px"></p>
    </div>`;
}

function abrirFormulario(a) {
  document.getElementById('formNovo').innerHTML = formularioHtml(a);
  document.getElementById('btnCancelarAula').addEventListener('click', () => { document.getElementById('formNovo').innerHTML = ''; });
  document.getElementById('btnSalvarAula').addEventListener('click', async () => {
    const payload = {
      titulo: document.getElementById('fTitulo').value.trim(),
      descricao: document.getElementById('fDescricao').value.trim() || null,
      video_url: document.getElementById('fVideo').value.trim() || null,
      arquivo_url: document.getElementById('fArquivo').value.trim() || null,
      ordem: Number(document.getElementById('fOrdem').value) || 0,
    };
    if (!payload.titulo) { document.getElementById('formMsg').textContent = 'Título é obrigatório.'; return; }
    let error;
    if (a && a.id) {
      ({ error } = await supabase.from('aulas_biblioteca').update(payload).eq('id', a.id));
    } else {
      const { data: { user } } = await supabase.auth.getUser();
      ({ error } = await supabase.from('aulas_biblioteca').insert({ ...payload, criado_por: user.id }));
    }
    if (error) { document.getElementById('formMsg').textContent = `Erro: ${error.message}`; return; }
    document.getElementById('formNovo').innerHTML = '';
    await carregarLista();
  });
}

async function carregarLista() {
  const wrap = document.getElementById('lista');
  const { data, error } = await supabase.from('aulas_biblioteca').select('*').order('ordem', { ascending: true });
  if (error) { wrap.innerHTML = `<div class="alert alert-error">${error.message}</div>`; return; }
  if (!data || data.length === 0) { wrap.innerHTML = '<p class="small" style="margin-top:16px">Nenhuma aula cadastrada ainda — clique em "+ Nova aula".</p>'; return; }
  wrap.innerHTML = data.map((a) => `
    <div class="au-card ${a.ativo ? '' : 'inativo'}" data-id="${a.id}">
      <div class="au-topo">
        <div>
          <h3>${a.titulo}</h3>
          <div class="au-meta">
            ${a.ativo ? '' : '<span>Arquivada</span>'}
            ${a.video_url ? `<a href="${a.video_url}" target="_blank" rel="noopener">Vídeo ↗</a>` : ''}
            ${a.arquivo_url ? `<a href="${a.arquivo_url}" target="_blank" rel="noopener">Arquivo ↗</a>` : ''}
          </div>
        </div>
      </div>
      ${a.descricao ? `<p style="font-size:13.5px;margin:10px 0 0">${a.descricao}</p>` : ''}
      <div class="au-acoes">
        <button type="button" class="btn alt" data-editar="${a.id}">Editar</button>
        <button type="button" class="btn alt" data-arquivar="${a.id}">${a.ativo ? 'Arquivar' : 'Reativar'}</button>
      </div>
    </div>`).join('');

  document.querySelectorAll('[data-editar]').forEach((btn) => {
    btn.addEventListener('click', () => { const a = data.find((x) => x.id === btn.dataset.editar); abrirFormulario(a); window.scrollTo(0, 0); });
  });
  document.querySelectorAll('[data-arquivar]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const a = data.find((x) => x.id === btn.dataset.arquivar);
      await supabase.from('aulas_biblioteca').update({ ativo: !a.ativo }).eq('id', a.id);
      carregarLista();
    });
  });
}

(async () => {
  const ctx = await requireAdmin('../../index.html', '../../login/index.html');
  if (!ctx) return;
  await mountAppShell('admin', ctx.session, '../..');
  document.getElementById('btnNovo').addEventListener('click', () => { abrirFormulario(null); window.scrollTo(0, 0); });
  await carregarLista();
})();
</script>
</body>
</html>
