<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Ficha da Turma | Painel Administrativo</title>
<link rel="stylesheet" href="../../../style.css">
<link rel="stylesheet" href="../../../assets/css/shell.css">
<style>
.mi-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}
.tabs-bar{display:flex;gap:4px;flex-wrap:wrap;margin-top:18px;border-bottom:1px solid var(--line);padding-bottom:0}
.tabs-bar button{font:inherit;font-size:13.5px;padding:10px 16px;border:none;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs-bar button.active{color:var(--green);font-weight:700;border-bottom-color:var(--green)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.badge-status{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:4px 10px;border-radius:999px}
.badge-status.rascunho{background:#eee;color:#666}
.badge-status.liberado{background:#e7f1ea;color:#245744}
.participante-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.participante-card b{color:var(--green);font-size:15px}
.participante-card .meta{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.encontro-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px;background:#fff}
.encontro-card .topo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.encontro-card textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13.5px;min-height:50px;margin-top:8px}
.material-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px;background:#fff}
.material-card b{color:var(--green)}
.form-inline{border:1px dashed var(--line);border-radius:12px;padding:16px;margin-top:16px;background:var(--paper,#fbfaf7)}
.form-inline label{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:10px 0 4px}
.form-inline label:first-child{margin-top:0}
.form-inline input,.form-inline select,.form-inline textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13.5px}
.form-inline textarea{min-height:50px}
</style>
</head>
<body>
<main class="wrap" style="max-width:1000px">
  <section class="section">
    <div class="eyebrow">Painel Administrativo · Turmas</div>
    <h1 class="serif" style="font-size:34px;color:var(--green);margin:8px 0" id="tituloFicha">Turma</h1>
    <p style="margin:0 0 6px"><a href="../index.html" class="small">← Voltar para Turmas</a></p>
    <div id="conteudo"><p>Carregando…</p></div>
  </section>
</main>
<footer>INDIA · CAFÉ, PESSOAS E NEGÓCIOS DE VALOR · Clínica de Valor</footer>

<script type="module">
import { supabase, avisarSupabaseNaoConfigurado } from '../../../assets/js/supabase-client.js';
import { requireAdmin } from '../../../assets/js/auth.js';
import { mountAppShell } from '../../../assets/js/app-shell.js';

avisarSupabaseNaoConfigurado();

const fmtData = (iso) => iso ? new Date(iso + 'T00:00:00').toLocaleDateString('pt-BR') : '—';
let turmaId = null;

function religarTabs() {
  document.querySelectorAll('.tabs-bar button').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tabs-bar button').forEach((b) => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector(`.tab-panel[data-tab="${btn.dataset.tab}"]`).classList.add('active');
    });
  });
}

async function carregarFicha() {
  const conteudo = document.getElementById('conteudo');
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { conteudo.innerHTML = '<p>Turma não encontrada (sem id na URL).</p>'; return; }
  turmaId = id;

  const { data: turma, error } = await supabase.from('turmas').select('*').eq('id', id).single();
  if (error || !turma) { conteudo.innerHTML = `<div class="alert alert-error">${error ? error.message : 'Turma não encontrada.'}</div>`; return; }
  document.getElementById('tituloFicha').textContent = turma.nome;

  const { data: participantes } = await supabase.from('mentoria_individual').select('*').eq('turma_id', id).order('nome_completo', { ascending: true });
  const idsParticipantes = (participantes || []).map((p) => p.id);
  const { data: diagnosticos } = idsParticipantes.length
    ? await supabase.from('mentoria_diagnosticos').select('mentoria_id, status').in('mentoria_id', idsParticipantes)
    : { data: [] };
  const { data: planos } = idsParticipantes.length
    ? await supabase.from('mentoria_planos_mensais').select('mentoria_id, status').in('mentoria_id', idsParticipantes)
    : { data: [] };
  const { data: encontros } = await supabase.from('turma_encontros').select('*').eq('turma_id', id).order('numero', { ascending: true });
  const { data: materiais } = await supabase.from('turma_materiais').select('*').eq('turma_id', id).order('criado_em', { ascending: false });

  conteudo.innerHTML = `
    <div class="mi-card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div>
          <h2 style="margin:0;color:var(--green)">${turma.nome}</h2>
          <div class="small" style="margin-top:4px">Ciclo ${turma.ciclo} · Status: ${turma.status} · ${(participantes || []).length} participante(s)</div>
        </div>
      </div>
      ${turma.observacoes ? `<p class="small" style="margin-top:10px;background:#fdf4e3;border-radius:8px;padding:10px 12px">${turma.observacoes}</p>` : ''}
    </div>

    <div class="tabs-bar">
      <button type="button" class="active" data-tab="participantes">Participantes</button>
      <button type="button" data-tab="encontros">Encontros</button>
      <button type="button" data-tab="materiais">Materiais</button>
    </div>

    <div class="tab-panel active" data-tab="participantes">
      <div class="mi-card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
          <h3 style="margin:0;color:var(--green)">Participantes</h3>
          <button type="button" class="btn alt" id="btnNovaParticipante" style="padding:8px 16px;font-size:13px">+ Adicionar participante</button>
        </div>
        <div id="formNovaParticipante"></div>
        ${(participantes && participantes.length) ? participantes.map((p) => {
          const diag = (diagnosticos || []).find((d) => d.mentoria_id === p.id);
          const plano = (planos || []).find((pl) => pl.mentoria_id === p.id);
          return `
          <div class="participante-card">
            <div>
              <b>${p.nome_completo}</b>
              <div class="meta">
                <span>Conta: ${p.user_id ? 'ativada' : 'não ativada'}</span>
                <span>Diagnóstico: ${diag ? `<span class="badge-status ${diag.status}">${diag.status}</span>` : 'não iniciado'}</span>
                <span>Plano: ${plano ? `<span class="badge-status ${plano.status}">${plano.status}</span>` : 'pendente'}</span>
              </div>
            </div>
            <a class="btn alt" href="../../mentorias/individual/index.html?id=${p.id}" style="padding:7px 14px;font-size:12.5px">Abrir ficha individual →</a>
          </div>`;
        }).join('') : '<p class="small" style="margin-top:10px">Nenhuma participante ainda.</p>'}
      </div>
    </div>

    <div class="tab-panel" data-tab="encontros">
      <div class="mi-card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
          <h3 style="margin:0;color:var(--green)">Encontros da turma</h3>
          <button type="button" class="btn alt" id="btnNovoEncontro" style="padding:8px 16px;font-size:13px">+ Adicionar encontro</button>
        </div>
        <div id="formNovoEncontro"></div>
        ${(encontros && encontros.length) ? encontros.map((e) => `
          <div class="encontro-card" data-encontro="${e.id}">
            <div class="topo">
              <b>Encontro ${e.numero}${e.data_agendada ? ` — ${fmtData(e.data_agendada)}` : ''}${e.modalidade ? ` (${e.modalidade})` : ''}</b>
            </div>
            ${e.observacoes ? `<p class="small" style="margin-top:6px">${e.observacoes}</p>` : ''}
          </div>`).join('') : '<p class="small" style="margin-top:10px">Nenhum encontro registrado ainda.</p>'}
      </div>
    </div>

    <div class="tab-panel" data-tab="materiais">
      <div class="mi-card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
          <h3 style="margin:0;color:var(--green)">Materiais compartilhados</h3>
          <button type="button" class="btn alt" id="btnNovoMaterial" style="padding:8px 16px;font-size:13px">+ Adicionar material</button>
        </div>
        <div id="formNovoMaterial"></div>
        ${(materiais && materiais.length) ? materiais.map((m) => `
          <div class="material-card">
            <b>${m.titulo}</b>${m.tipo ? ` <span class="small">(${m.tipo})</span>` : ''}
            ${m.descricao ? `<p class="small" style="margin-top:6px">${m.descricao}</p>` : ''}
            ${m.url ? `<a href="${m.url}" target="_blank" rel="noopener" class="small">Abrir ↗</a>` : ''}
          </div>`).join('') : '<p class="small" style="margin-top:10px">Nenhum material ainda.</p>'}
      </div>
    </div>
  `;

  religarTabs();
  religarEventosParticipantes(turma);
  religarEventosEncontros();
  religarEventosMateriais();
}

function religarEventosParticipantes(turma) {
  document.getElementById('btnNovaParticipante').addEventListener('click', () => {
    const wrap = document.getElementById('formNovaParticipante');
    if (wrap.dataset.aberto === '1') { wrap.innerHTML = ''; wrap.dataset.aberto = '0'; return; }
    wrap.dataset.aberto = '1';
    wrap.innerHTML = `
      <div class="form-inline">
        <label>Nome completo</label><input type="text" id="fNomeParticipante">
        <div style="display:flex;gap:10px;margin-top:12px">
          <button type="button" class="btn" id="btnSalvarParticipante" style="padding:9px 16px;font-size:13.5px">Adicionar</button>
          <button type="button" class="btn alt" id="btnCancelarParticipante" style="padding:9px 16px;font-size:13.5px">Cancelar</button>
        </div>
        <p class="small" id="participanteMsg" style="margin-top:8px"></p>
      </div>`;
    document.getElementById('btnCancelarParticipante').addEventListener('click', () => { wrap.innerHTML = ''; wrap.dataset.aberto = '0'; });
    document.getElementById('btnSalvarParticipante').addEventListener('click', async () => {
      const nome = document.getElementById('fNomeParticipante').value.trim();
      if (!nome) { document.getElementById('participanteMsg').textContent = 'Nome é obrigatório.'; return; }
      const { data: { user } } = await supabase.auth.getUser();
      const { error } = await supabase.from('mentoria_individual').insert({
        nome_completo: nome, turma_id: turma.id, status: 'ativa', cadencia_encontros: 'quinzenal', criado_por: user.id,
      });
      if (error) { document.getElementById('participanteMsg').textContent = `Erro: ${error.message}`; return; }
      await carregarFicha();
      document.querySelector('.tabs-bar button[data-tab="participantes"]').click();
    });
  });
}

function religarEventosEncontros() {
  document.getElementById('btnNovoEncontro').addEventListener('click', () => {
    const wrap = document.getElementById('formNovoEncontro');
    if (wrap.dataset.aberto === '1') { wrap.innerHTML = ''; wrap.dataset.aberto = '0'; return; }
    wrap.dataset.aberto = '1';
    wrap.innerHTML = `
      <div class="form-inline">
        <label>Número</label><input type="number" id="fNumeroEncontro" min="1" value="1">
        <label>Data</label><input type="date" id="fDataEncontro">
        <label>Modalidade</label>
        <select id="fModalidadeEncontro"><option value="online">Online</option><option value="presencial">Presencial</option></select>
        <label>Observações</label><textarea id="fObsEncontro"></textarea>
        <div style="display:flex;gap:10px;margin-top:12px">
          <button type="button" class="btn" id="btnSalvarEncontro" style="padding:9px 16px;font-size:13.5px">Adicionar</button>
          <button type="button" class="btn alt" id="btnCancelarEncontro" style="padding:9px 16px;font-size:13.5px">Cancelar</button>
        </div>
        <p class="small" id="encontroMsg" style="margin-top:8px"></p>
      </div>`;
    document.getElementById('btnCancelarEncontro').addEventListener('click', () => { wrap.innerHTML = ''; wrap.dataset.aberto = '0'; });
    document.getElementById('btnSalvarEncontro').addEventListener('click', async () => {
      const { error } = await supabase.from('turma_encontros').insert({
        turma_id: turmaId,
        numero: Number(document.getElementById('fNumeroEncontro').value) || 1,
        data_agendada: document.getElementById('fDataEncontro').value || null,
        modalidade: document.getElementById('fModalidadeEncontro').value,
        observacoes: document.getElementById('fObsEncontro').value.trim() || null,
      });
      if (error) { document.getElementById('encontroMsg').textContent = `Erro: ${error.message}`; return; }
      await carregarFicha();
      document.querySelector('.tabs-bar button[data-tab="encontros"]').click();
    });
  });
}

function religarEventosMateriais() {
  document.getElementById('btnNovoMaterial').addEventListener('click', () => {
    const wrap = document.getElementById('formNovoMaterial');
    if (wrap.dataset.aberto === '1') { wrap.innerHTML = ''; wrap.dataset.aberto = '0'; return; }
    wrap.dataset.aberto = '1';
    wrap.innerHTML = `
      <div class="form-inline">
        <label>Título</label><input type="text" id="fTituloMaterial">
        <label>Tipo</label>
        <select id="fTipoMaterial"><option value="video">Vídeo</option><option value="documento">Documento</option><option value="link">Link</option></select>
        <label>URL</label><input type="url" id="fUrlMaterial" placeholder="https://...">
        <label>Descrição</label><textarea id="fDescMaterial"></textarea>
        <div style="display:flex;gap:10px;margin-top:12px">
          <button type="button" class="btn" id="btnSalvarMaterial" style="padding:9px 16px;font-size:13.5px">Adicionar</button>
          <button type="button" class="btn alt" id="btnCancelarMaterial" style="padding:9px 16px;font-size:13.5px">Cancelar</button>
        </div>
        <p class="small" id="materialMsg" style="margin-top:8px"></p>
      </div>`;
    document.getElementById('btnCancelarMaterial').addEventListener('click', () => { wrap.innerHTML = ''; wrap.dataset.aberto = '0'; });
    document.getElementById('btnSalvarMaterial').addEventListener('click', async () => {
      const titulo = document.getElementById('fTituloMaterial').value.trim();
      if (!titulo) { document.getElementById('materialMsg').textContent = 'Título é obrigatório.'; return; }
      const { data: { user } } = await supabase.auth.getUser();
      const { error } = await supabase.from('turma_materiais').insert({
        turma_id: turmaId, titulo, tipo: document.getElementById('fTipoMaterial').value,
        url: document.getElementById('fUrlMaterial').value.trim() || null,
        descricao: document.getElementById('fDescMaterial').value.trim() || null,
        criado_por: user.id,
      });
      if (error) { document.getElementById('materialMsg').textContent = `Erro: ${error.message}`; return; }
      await carregarFicha();
      document.querySelector('.tabs-bar button[data-tab="materiais"]').click();
    });
  });
}

(async () => {
  const ctx = await requireAdmin('../../../index.html', '../../../login/index.html');
  if (!ctx) return;
  await mountAppShell('admin', ctx.session, '../../..');
  await carregarFicha();
})();
</script>
</body>
</html>
